<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal IA</title>
<meta name="description" content="Signaux des IA crypto et matières premières — tests en argent fictif">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Signal IA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --pos:#15803d; --neg:#b91c1c; --warn:#b45309; --chip:#eef2ff; --chip-ink:#1e3a8a;
  --pos-bg:#ecfdf3; --neg-bg:#fef2f2; --warn-bg:#fffbeb; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#17212c; --ink:#e7ecf2; --muted:#94a3b8; --line:#263241;
    --accent:#60a5fa; --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --chip:#1e293b; --chip-ink:#bfdbfe;
    --pos-bg:#0f2a1c; --neg-bg:#2a1414; --warn-bg:#2a2210; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --card:#17212c; --ink:#e7ecf2; --muted:#94a3b8; --line:#263241;
  --accent:#60a5fa; --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --chip:#1e293b; --chip-ink:#bfdbfe;
  --pos-bg:#0f2a1c; --neg-bg:#2a1414; --warn-bg:#2a2210; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.updated{font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:20px;flex:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.dom{margin-top:8px} .dom button.on{background:var(--ink);color:var(--bg)}
.sig{font-size:28px;font-weight:800;border-radius:14px;padding:14px;text-align:center;margin:10px 0 6px}
.sig.buy{background:var(--pos-bg);color:var(--pos)} .sig.out{background:var(--warn-bg);color:var(--warn)}
.votes{display:flex;gap:6px;justify-content:center;margin:6px 0}
.votes span{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.votes .v1{background:var(--pos-bg);color:var(--pos)} .votes .v0{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.votes .vm1{background:var(--neg-bg);color:var(--neg)}
.sig.sell{background:var(--neg-bg);color:var(--neg)}
.calc input{width:100%;font-size:20px;font-weight:700;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0 4px}
.how p{margin:8px 0;font-size:14px} .how b{color:var(--ink)}
.c2{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.c2:first-of-type{border-top:0}
.c2 .s{font-size:12px;font-weight:800;border-radius:8px;padding:5px 8px;text-align:center}
.s.buy{background:var(--pos-bg);color:var(--pos)} .s.out{background:var(--warn-bg);color:var(--warn)} .s.sell{background:var(--neg-bg);color:var(--neg)}
.todo{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
main{padding:4px 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.pill.ok{background:var(--pos-bg);color:var(--pos)} .pill.ko{background:var(--neg-bg);color:var(--neg)} .pill.wait{background:var(--warn-bg);color:var(--warn)}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.coin{background:var(--chip);color:var(--chip-ink);border-radius:12px;padding:12px 6px;text-align:center}
.coin b{display:block;font-size:20px} .coin span{font-size:12px;opacity:.85}
.cash{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:16px;text-align:center;font-weight:800;font-size:20px;margin:12px 0 4px}
.act{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-right:6px}
.tag.buy{background:var(--pos-bg);color:var(--pos)} .tag.sell{background:var(--neg-bg);color:var(--neg)}
.done{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:var(--accent);color:#fff}
.done.is{background:var(--pos-bg);color:var(--pos);border:1px solid var(--pos)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rank{display:grid;grid-template-columns:28px 60px 1fr;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.rank .b{height:8px;border-radius:99px;background:var(--accent);opacity:.75}
.rank .b.n{background:var(--neg);opacity:.55}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.week{border-top:1px solid var(--line);padding:10px 0}
.week:first-of-type{border-top:0}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;text-align:center}
.wgrid div{background:var(--bg);border-radius:10px;padding:6px 2px;font-size:12px}
.wgrid b{display:block;font-size:15px}
.crit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.notice{font-size:12px;color:var(--muted);text-align:center;margin:18px 6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav button.on{color:var(--accent)}
.err{background:var(--neg-bg);color:var(--neg);border-radius:12px;padding:12px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1 id="title">Signal IA</h1><div class="updated" id="updated">Chargement…</div></div>
    <button class="iconbtn" id="refresh" aria-label="Actualiser">↻</button>
  </div>
  <div class="seg dom" id="dom">
    <button data-d="crypto" class="on">Crypto</button>
    <button data-d="v2">Crypto v2</button>
    <button data-d="matieres">Matières</button>
  </div>
  <div class="seg" id="v2seg" style="display:none">
    <button data-k="achat_seul" class="on">Achat seulement (5)</button>
    <button data-k="achat_vente">Achat et vente (8)</button>
  </div>
  <div class="seg" id="mseg" style="display:none">
    <button data-m="SI" class="on">Argent</button>
    <button data-m="LE">Bovins</button>
    <button data-m="HG">Cuivre</button>
  </div>
  <div class="seg" id="seg">
    <button data-p="quotidien" class="on">Quotidien</button>
    <button data-p="hebdomadaire">Hebdomadaire</button>
    <button data-p="v5">v5 Répartition</button>
  </div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="jour" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
  <button data-t="pf"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Portefeuille</button>
  <button data-t="sem" id="navsem"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaines</button>
  <button data-t="ver"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Verdict</button>
</nav>
<script>
(function(){
  "use strict";
  var DATA = null, P = "quotidien", TAB = "jour", MDATA = null, DOM = "crypto", MK = "SI", V5 = null, V2 = null, K2 = "achat_seul";
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };
  P = store.get("pf") || "quotidien"; TAB = store.get("tab") || "jour"; DOM = store.get("dom") || "crypto"; MK = store.get("mk") || "SI"; K2 = store.get("k2") || "achat_seul";
  var montant = function(){ var v = parseFloat(store.get("montant")); return v > 0 ? v : 1000; };

  var nf = function(x, d){ return x == null ? "—" : Number(x).toLocaleString("fr-FR", {minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}); };
  var pct = function(x){ return x == null ? "—" : (x > 0 ? "+" : "") + nf(x) + " %"; };
  var cls = function(x){ return x == null ? "" : (x > 0 ? "pos" : (x < 0 ? "neg" : "")); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
  var dfr = function(s, opt){ if(!s) return "—"; var d = new Date(s + "T12:00:00Z"); return d.toLocaleDateString("fr-FR", opt || {weekday:"long", day:"numeric", month:"long"}); };
  var dshort = function(s){ return dfr(s, {day:"numeric", month:"short"}); };

  function load(){
    document.getElementById("updated").textContent = "Chargement…";
    fetch("data/app.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ DATA = j; render(); })
      .catch(function(e){
        document.getElementById("updated").textContent = "Hors ligne";
        if(!DATA && DOM === "crypto") document.getElementById("main").innerHTML = '<div class="err">Impossible de charger les données (' + esc(e.message) + '). Vérifiez votre connexion puis touchez « Actualiser ».</div>';
      });
  }

  function loadMat(){
    fetch("data/matieres.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ MDATA = j; render(); })
      .catch(function(e){ if(DOM === "matieres" && !MDATA){ document.getElementById("updated").textContent = "Pas encore de données";
        document.getElementById("main").innerHTML = '<div class="card">Les premiers signaux des matières premières apparaîtront après le premier calcul (chaque soir de semaine vers 23 h 30, heure du Maroc).</div>'; } });
  }

  function loadV5(){
    fetch("data/crypto_v5.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ V5 = j; render(); }).catch(function(){});
  }

  function loadV2(){
    fetch("data/crypto_v2.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ V2 = j; render(); }).catch(function(){ if(DOM === "v2" && !V2) render(); });
  }

  // ------------------------------------------------------------- retrait chaque semaine (calcul fait dans l'application)
  // Règle : tous les 7 jours depuis le début du test, on fait le bilan. Si le capital du robot dépasse son capital de
  // référence (départ, ou capital après le dernier retrait), on sort X % de ce gain (frais de vente 0,15 %) et le robot
  // repart avec le reste. Semaine perdante : rien n'est sorti, le robot doit d'abord revenir à son capital.
  // Les décisions de l'IA sont en pourcentages : le résultat est le même que si le moteur faisait le retrait.
  var RET = 10;                                   // % du portefeuille fictif principal
  var retraitPct = function(){ var v = parseFloat(store.get("retrait_pct")); return v >= 0 && v <= 100 ? v : RET; };
  function curvePts(c){ return (c || []).map(function(p){ return Array.isArray(p) ? [p[0], p[1]] : [p.d, p.robot]; }).filter(function(p){ return p[1] > 0; }); }
  var ddays = function(a, b){ return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); };
  var addDays = function(a, n){ var d = new Date(a + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  function retraitSim(curve, M, pctR, cap, debut){
    var pts = curvePts(curve), I = M, HW = M, out = 0, prev = cap || 1000, wk = 0, startW = M, sem = [], tot = [], inv = [], cost = 0.0015;
    debut = debut || (pts.length ? pts[0][0] : null);
    var lastD = null;
    pts.forEach(function(p){
      var w = Math.floor(ddays(debut, p[0]) / 7);
      if(w > wk){
        // bilan de la semaine terminée, avec la valeur du dernier jour de cette semaine (avant le jour qui commence)
        var fin = I, wd = 0;
        if(pctR > 0 && I > HW){ wd = pctR / 100 * (I - HW); I -= wd; out += wd * (1 - cost); HW = I; }
        sem.push({n: wk + 1, du: addDays(debut, 7 * wk), au: lastD || addDays(debut, 7 * wk + 6), d: p[0], depart: startW, fin: fin, gain: fin - startW, retire: wd, capital: I, reference: HW});
        startW = I; wk = w;
      }
      I *= p[1] / prev; prev = p[1]; lastD = p[0];
      tot.push([p[0], I + out]); inv.push([p[0], I]);
    });
    var last = pts.length ? pts[pts.length - 1][0] : null, lastS = sem.length ? sem[sem.length - 1] : null;
    var prochain = debut ? addDays(debut, 7 * (wk + 1)) : null;
    return {capital: I, retire: out, total: I + out, reference: HW, semaines: sem, total_courbe: tot, capital_courbe: inv, depart: M,
            nb: sem.filter(function(x){ return x.retire > 0; }).length, prochain: prochain, jours_avant: last && prochain ? Math.max(0, ddays(last, prochain)) : null,
            aujourdhui: lastS && lastS.d === last ? lastS : null, semaine_en_cours: I - startW, dernier: last,
            en_cours: {n: wk + 1, du: debut ? addDays(debut, 7 * wk) : null, depart: startW, actuel: I, gain: I - startW, prevu: pctR > 0 && I > HW ? pctR / 100 * (I - HW) : 0}};
  }
  function semainesHisto(R, ouvert){
    var h = '<details' + (ouvert ? ' open' : '') + '><summary>📅 Bilan semaine par semaine</summary><table style="font-size:13px"><tr><th>Semaine</th><th>Départ</th><th>Fin</th><th>Sorti</th></tr>';
    var E = R.en_cours;
    if(E && E.du) h += '<tr><td><b>' + E.n + '</b> <span class="muted">en cours</span><br><span class="small muted">depuis le ' + esc(dshort(E.du)) + '</span></td><td>' + nf(E.depart) + ' $</td><td>' + nf(E.actuel) + ' $<br><span class="small ' + cls(E.gain) + '">' + (E.gain > 0 ? "+" : "") + nf(E.gain) + ' $</span></td><td class="muted">' + (E.prevu > 0 ? '≈ ' + nf(E.prevu) + ' $<br><span class="small">le ' + esc(dshort(R.prochain)) + '</span>' : '—') + '</td></tr>';
    R.semaines.slice().reverse().forEach(function(x){ h += '<tr><td><b>' + x.n + '</b><br><span class="small muted">' + esc(dshort(x.du)) + ' → ' + esc(dshort(x.au)) + '</span></td><td>' + nf(x.depart) + ' $</td><td>' + nf(x.fin) + ' $<br><span class="small ' + cls(x.gain) + '">' + (x.gain > 0 ? "+" : "") + nf(x.gain) + ' $</span></td><td>' + (x.retire > 0 ? '<span class="pos">' + nf(x.retire) + ' $</span>' : '—') + '</td></tr>'; });
    h += '<tr><td><b>Total</b></td><td>' + nf(R.depart) + ' $</td><td>' + nf(R.capital) + ' $</td><td class="pos"><b>' + nf(R.retire) + ' $</b></td></tr>';
    return h + '</table><div class="small muted">Départ = capital du robot au début de la semaine. Sorti = 10 % du gain au-dessus du capital, retiré au bilan ; le robot repart avec le reste.</div></details>';
  }
  // Carte principale « portefeuille fictif avec retrait chaque semaine » (utilisée en haut des écrans)
  function wk(curve, cap, debut){ return curvePts(curve).length ? retraitSim(curve, cap, RET, cap, debut) : null; }
  function wkKpis(R, cap, compLabel, compPct){
    var tp = (R.total / cap - 1) * 100;
    return '<div class="kpis">' +
      '<div class="kpi"><div class="l">Capital du robot</div><div class="v">' + nf(R.capital) + ' $</div></div>' +
      '<div class="kpi"><div class="l">Total sorti (' + R.nb + ' retrait' + (R.nb > 1 ? 's' : '') + ')</div><div class="v pos">' + nf(R.retire) + ' $</div></div>' +
      '<div class="kpi"><div class="l">Capital + sorti</div><div class="v ' + cls(tp) + '">' + nf(R.total) + ' $ <span class="small">(' + pct(tp) + ')</span></div></div>' +
      '<div class="kpi"><div class="l">' + esc(compLabel) + '</div><div class="v ' + cls(compPct) + '">' + pct(compPct) + '</div></div></div>' +
      '<div class="small muted" style="margin-top:6px">' + (R.aujourdhui ? (R.aujourdhui.retire > 0 ? '<b class="pos">Bilan de la semaine aujourd\'hui : sortir ' + nf(R.aujourdhui.retire) + ' $.</b> ' : '<b>Bilan de la semaine aujourd\'hui : pas de gain au-dessus du capital, rien à sortir.</b> ') : '') +
      'Chaque semaine, ' + RET + ' % du gain sont sortis et le robot repart avec le reste. Prochain bilan : ' + esc(dfr(R.prochain)) + (R.capital < R.reference - 0.005 ? ' · le robot doit d\'abord revenir à ' + nf(R.reference) + ' $' : '') + '.</div>' + semainesHisto(R, true);
  }
  function wkFactor(R, full){ return R && full > 0 ? R.capital / full : 1; }
  function bigWk(R, cap, debutTxt){
    var tp = (R.total / cap - 1) * 100;
    return '<div class="small muted">Capital du robot (après retraits)</div><div class="big">' + nf(R.capital) + ' $</div>' +
      '<div><span class="pos">+ ' + nf(R.retire) + ' $ sortis</span> · capital + sorti <b class="' + cls(tp) + '">' + nf(R.total) + ' $ (' + pct(tp) + ')</b> depuis le ' + esc(debutTxt) + '</div>';
  }
  function retraitCard(curve, cap, debut){
    var R = wk(curve, cap, debut);
    if(!R) return "";
    var pts = curvePts(curve), full = pts[pts.length - 1][1];
    var h = '<div class="card"><h2>Retraits chaque semaine (' + RET + ' % du gain)</h2>';
    h += '<div class="kpis"><div class="kpi"><div class="l">Départ</div><div class="v">' + nf(cap) + ' $</div></div>' +
      '<div class="kpi"><div class="l">Capital + sorti</div><div class="v ' + cls(R.total - cap) + '">' + nf(R.total) + ' $</div></div>' +

  function lineChart(series, opts){
    // series: [{pts:[[date,val],...], color, dash}]
    var W = 600, H = 220, L = 46, R = 8, T = 10, B = 24;
    var all = []; series.forEach(function(s){ s.pts.forEach(function(p){ if(p[1] != null) all.push(p[1]); }); });
    if(!all.length) return "";
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    if(opts && opts.base != null){ min = Math.min(min, opts.base); max = Math.max(max, opts.base); }
    var pad = (max - min) * 0.08 || 10; min -= pad; max += pad;
    var n = Math.max.apply(null, series.map(function(s){ return s.pts.length; }));
    var x = function(i){ return L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1)); };
    var y = function(v){ return T + (max - v) * (H - T - B) / (max - min); };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Évolution du capital">';
    for(var k = 0; k <= 4; k++){
      var v = min + (max - min) * k / 4, yy = y(v);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)"/>';
      g += '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + nf(v, 0) + '</text>';
    }
    if(opts && opts.base != null){ g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(opts.base) + '" y2="' + y(opts.base) + '" stroke="var(--muted)" stroke-dasharray="4 4"/>'; }
    var ref = series[0].pts;
    [0, Math.floor((ref.length - 1) / 2), ref.length - 1].forEach(function(i, idx){
      if(ref[i]) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (idx === 0 ? "start" : idx === 2 ? "end" : "middle") + '">' + dshort(ref[i][0]) + '</text>';
    });
    series.forEach(function(s){
      var d = ""; s.pts.forEach(function(p, i){ if(p[1] != null) d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(p[1]).toFixed(1); });
      g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.w || 2.2) + '" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>';
    });
    return g + '</svg>';
  }

    var RW = pf.commence ? wk(pf.courbe, t.capital, t.debut) : null, F = wkFactor(RW, pf.valeur);
    if(!pf.commence){
      h += '<div class="card"><h2>Le test n\'a pas encore commencé</h2><p>Le premier signal sera calculé à la clôture du <b>' + esc(dfr(t.debut)) + '</b> et apparaîtra ici le lendemain matin.</p>';
      if(DATA.apercu){
        var a = DATA.apercu;
        h += '<p class="small muted">Aperçu indicatif (non enregistré) avec les données du ' + esc(dfr(a.date)) + ' : filtre Bitcoin ' + (a.filtre ? "positif" : "négatif (cash)") + ', classement IA : <b>' + a.classement.map(esc).join(", ") + '</b>.</p>';
      }
      return h + '</div>';
    }
    var s = pf.signal;
    var head = P === "quotidien" ? "Signal pour " + dfr(s.applicable_le) : "Signal de la semaine (dimanche " + dshort(s.date_calcul) + ")";
    h += '<div class="card"><h2>' + esc(head) + '</h2>';
    h += s.filtre ? '<span class="pill ok">● Filtre Bitcoin positif</span>' : '<span class="pill ko">● Filtre Bitcoin négatif</span>';
    h += '<div class="small muted" style="margin-top:6px">BTC ' + pct(s.btc_vs_moy100) + ' par rapport à sa moyenne ' + t.filtre_jours + ' jours</div>';
    if(s.top.length){
      h += '<div class="coins">' + s.top.map(function(c){ return '<div class="coin"><b>' + esc(c) + '</b><span>' + nf(100 / s.top.length, 0) + ' %</span></div>'; }).join("") + '</div>';
    } else {
      h += '<div class="cash">Rester en USDT</div><div class="small muted" style="text-align:center">Aucune crypto tant que le filtre est négatif.</div>';
    }
    var major = s.actions.filter(function(a){ return a.majeur; }), minor = s.actions.filter(function(a){ return !a.majeur; });
    h += '<div style="margin-top:12px"><b>À faire</b></div>';
    if(!major.length) h += '<div class="act"><span class="muted">Aucun changement important</span></div>';
    major.forEach(function(a){
      h += '<div class="act"><span><span class="tag ' + (a.action === "ACHETER" ? "buy" : "sell") + '">' + a.action + '</span><b>' + esc(a.crypto) + '</b> <span class="muted small">' + esc(a.type) + '</span></span><span>' + nf(a.usdt * F) + ' USDT</span></div>';
    });
    if(minor.length){
      h += '<details><summary>' + minor.length + ' petit(s) ajustement(s) facultatif(s)</summary>';
      minor.forEach(function(a){ h += '<div class="act small"><span>' + a.action.toLowerCase() + ' ' + esc(a.crypto) + '</span><span>' + nf(a.usdt * F) + ' USDT</span></div>'; });
      h += '</details>';
    }
    var k = doneKey(s), d = store.get(k);
    h += '<button class="done' + (d ? " is" : "") + '" id="donebtn">' + (d ? "✓ Fait le " + esc(d) + " (toucher pour annuler)" : (major.length ? "✅ C'est fait" : "✅ Vu, rien à faire")) + '</button>';
    if(s.prochain) h += '<div class="small muted" style="margin-top:8px;text-align:center">Prochain signal : ' + esc(dfr(s.prochain)) + ' (disponible le lendemain matin)</div>';
    h += '</div>';

    var j = pf.jour;
    if(j && j.date){
      h += '<div class="card"><h2>Résultat du ' + esc(dfr(j.date)) + '</h2>';
      h += '<div class="big ' + cls(j.variation_pct) + '">' + pct(j.variation_pct) + '</div>';
      h += '<div class="' + cls(j.variation_usdt) + '">' + (j.variation_usdt > 0 ? "+" : "") + nf(j.variation_usdt) + ' USDT</div>';
      h += '<div class="small muted" style="margin:4px 0 6px">Bitcoin le même jour : <span class="' + cls(j.btc_pct) + '">' + pct(j.btc_pct) + '</span></div>';
      if(j.details && j.details.length){ j.details.forEach(function(c){ h += '<div class="row small"><span><b>' + esc(c.crypto) + '</b></span><span class="' + cls(c.variation) + '">' + pct(c.variation) + ' · ' + nf(c.gain) + ' USDT</span></div>'; }); }
      else h += '<div class="small muted">Portefeuille en USDT ce jour-là (aucune variation).</div>';
      h += '</div>';
    }
    h += calcCard(s.top.length ? s.top.map(function(c){ return {nom: c, pct: 100 / s.top.length}; }) : [{nom: "USDT", pct: 100, note: "filtre négatif"}],
      [{label: "Gain depuis le début du test", pct: pf.rendement_pct}, {label: j && j.date ? "Résultat du " + dshort(j.date) : "Dernier jour", pct: j ? j.variation_pct : null}], pf.courbe, DATA.test.capital, DATA.test.debut);
    h += '<div class="card"><h2>Portefeuille fictif (retrait chaque semaine)</h2>' + (RW ? wkKpis(RW, t.capital, "Bitcoin (même période)", pf.btc_rendement_pct) : '') + '<div class="small muted" style="margin-top:4px">Sans aucun retrait : ' + nf(pf.valeur) + ' $ (' + pct(pf.rendement_pct) + ') · frais payés ' + nf(pf.frais_total) + ' $</div></div>';
    if(DATA.classement){
      var sc = DATA.classement.scores, keys = Object.keys(sc), mx = Math.max.apply(null, keys.map(function(k){ return Math.abs(sc[k]); })) || 1;
      h += '<div class="card"><h2>Classement IA du ' + esc(dshort(DATA.classement.date)) + '</h2>';
      keys.forEach(function(c, i){ var v = sc[c]; h += '<div class="rank"><span class="muted">' + (i + 1) + '</span><b>' + esc(c) + '</b><div class="b' + (v < 0 ? " n" : "") + '" style="width:' + Math.max(4, Math.abs(v) / mx * 100) + '%"></div></div>'; });
      h += '<div class="small muted">Bleu = cryptos que l\'IA préfère pour les 7 prochains jours, rouge = celles qu\'elle évite. Le portefeuille prend les 3 premières si le filtre est positif.</div></div>';
    }
    return h + howCard("v4");
  }

  function viewPf(pf){
    if(!pf.commence) return '<div class="card">Le portefeuille démarre le ' + esc(dfr(DATA.test.debut)) + '.</div>';
    var RW = wk(pf.courbe, DATA.test.capital, DATA.test.debut), F = wkFactor(RW, pf.valeur);
    var h = '<div class="card"><h2>' + esc(pf.nom) + '</h2>' + (RW ? bigWk(RW, DATA.test.capital, dshort(DATA.test.debut)) : '') + '<div class="small muted">Sans retrait : ' + nf(pf.valeur) + ' $ (' + pct(pf.rendement_pct) + ')</div>';
    h += lineChart([{pts: pf.courbe, color: "var(--accent)", w: 2.6}, {pts: DATA.btc_courbe.slice(0, pf.courbe.length), color: "#f59e0b"}], {base: DATA.test.capital});
    h += '<div class="legend"><span><i style="background:var(--accent)"></i>IA (fictif)</span><span><i style="background:#f59e0b"></i>Bitcoin</span><span><i style="background:var(--muted)"></i>Départ ' + nf(DATA.test.capital, 0) + ' $</span></div></div>';
    h += '<div class="card"><h2>Positions actuelles</h2>';
    if(!pf.positions.length) h += '<div class="row"><span>USDT</span><span>' + nf(pf.cash * F) + ' $ · 100 %</span></div>';
    pf.positions.forEach(function(p){ h += '<div class="row"><span><b>' + esc(p.crypto) + '</b> <span class="small muted">' + nf(p.quantite * F, 4) + '</span></span><span>' + nf(p.valeur * F) + ' $ · ' + nf(p.poids, 1) + ' %</span></div>'; });
    if(pf.positions.length && pf.cash > 1) h += '<div class="row"><span>USDT</span><span>' + nf(pf.cash * F) + ' $</span></div>';
    h += '</div>';
    var withAct = pf.historique.filter(function(x){ return x.actions.length; });
    var followed = withAct.filter(function(x){ return store.get("fait:" + P + ":" + x.date); }).length;
    h += retraitCard(pf.courbe, DATA.test.capital, DATA.test.debut);
    h += '<div class="card"><h2>Statistiques</h2><div class="kpis">' +
      '<div class="kpi"><div class="l">Pire baisse IA</div><div class="v neg">' + pct(pf.pire_baisse_pct) + '</div></div>' +
      '<div class="kpi"><div class="l">Pire baisse Bitcoin</div><div class="v neg">' + pct(pf.btc_pire_baisse_pct) + '</div></div>' +
      '<div class="kpi"><div class="l">Transactions</div><div class="v">' + pf.transactions + '</div></div>' +
      '<div class="kpi"><div class="l">Frais payés</div><div class="v">' + nf(pf.frais_total) + ' $</div></div>' +
      '<div class="kpi"><div class="l">Décisions en cash</div><div class="v">' + pf.decisions_cash + ' / ' + pf.decisions + '</div></div>' +
      '<div class="kpi"><div class="l">Signaux suivis (« C\'est fait »)</div><div class="v">' + followed + ' / ' + withAct.length + '</div></div></div></div>';
    h += '<div class="card"><h2>Derniers signaux</h2>';
    pf.historique.slice().reverse().slice(0, 30).forEach(function(x){
      var f = store.get("fait:" + P + ":" + x.date);
      h += '<div class="row small"><span>' + esc(dshort(x.date)) + ' ' + (f ? "✓" : "") + '</span><span>' + (x.top.length ? x.top.map(esc).join(", ") : '<span class="muted">USDT</span>') + '</span><span>' + nf(x.valeur) + ' $</span></div>';
    });
    return h + '</div>';
  }

  function viewSem(){
    var w = DATA.semaines.slice().reverse();
    var h = '<div class="card"><h2>Bilan de chaque semaine</h2>';
    if(!w.length) h += '<div class="muted">Le premier bilan apparaîtra une semaine après le début du test.</div>';
    w.forEach(function(s){
      var ic = s.ic == null ? '<span class="muted">—</span>' : (s.ic > 0 ? '<span class="pill ok">IA a bien classé</span>' : '<span class="pill ko">IA s\'est trompée</span>');
      h += '<div class="week"><div style="display:flex;justify-content:space-between;align-items:center"><b>Semaine ' + s.semaine + '</b>' + ic + '</div>';
      h += '<div class="small muted">' + esc(dshort(s.du)) + ' → ' + esc(dshort(s.au)) + ' · hebdo : ' + (s.top_hebdo.length ? s.top_hebdo.map(esc).join(", ") : "USDT") + ' · quotidien : ' + s.jours_cash_quotidien + ' j en cash</div>';
      h += '<div class="wgrid"><div>Quotidien<b class="' + cls(s.quotidien) + '">' + pct(s.quotidien) + '</b></div><div>Hebdo<b class="' + cls(s.hebdomadaire) + '">' + pct(s.hebdomadaire) + '</b></div><div>Bitcoin<b class="' + cls(s.btc) + '">' + pct(s.btc) + '</b></div></div></div>';
    });
    return h + '</div>';
  }

  function viewVer(){
    var t = DATA.test, h = "";
    var dd = function(a, b){ return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); };
    var totalJ = dd(t.debut, t.fin), jours = Math.max(0, Math.min(totalJ, dd(t.debut, DATA.donnees_jusqu_au)));
    var majLe = dfr(String(DATA.genere_le).slice(0, 10), {day:"numeric", month:"short"}) + " à " + String(DATA.genere_le).slice(11);
    ["quotidien", "hebdomadaire"].forEach(function(p){
      var pf = DATA.portefeuilles[p], v = pf.verdict || {semaines:0, criteres:[], texte:"—", statut:"pas commencé"};
      var pc = v.statut === "validé" ? "ok" : (v.statut === "non validé" ? "ko" : "wait");
      h += '<div class="card"><h2>' + esc(pf.nom) + '</h2><span class="pill ' + pc + '">' + esc(v.statut.toUpperCase()) + '</span>';
      if(p === "quotidien" && v.statut === "en cours" && pf.commence){
        // Suivi jour par jour (affichage seulement, le moteur v4 n'est pas modifié)
        var ic = (v.criteres[1] || {ok: false}).ok;
        var RWv = wk(pf.courbe, t.capital, t.debut), tpv = RWv ? (RWv.total / t.capital - 1) * 100 : pf.rendement_pct;
        var cr = [{nom: "Capital + retraits meilleur que le Bitcoin (" + pct(tpv) + " contre " + pct(pf.btc_rendement_pct) + ")", ok: tpv > pf.btc_rendement_pct},
                  {nom: "Classements de l'IA utiles (IC moyen > 0) — mesuré chaque semaine, il faut 7 jours pour juger un classement", ok: ic},
                  {nom: "Pire baisse plus faible que le Bitcoin (" + pct(pf.pire_baisse_pct) + " contre " + pct(pf.btc_pire_baisse_pct) + ")", ok: pf.pire_baisse_pct >= pf.btc_pire_baisse_pct}];
        var n = cr.filter(function(c){ return c.ok; }).length;
        h += '<div class="bar"><i style="width:' + Math.min(100, jours / totalJ * 100) + '%"></i></div><div class="small muted">Jour ' + jours + ' / ' + totalJ + ' · mis à jour le ' + esc(majLe) + ' · fin le ' + esc(dfr(t.fin)) + '</div>';
        cr.forEach(function(c){ h += '<div class="crit"><span>' + (c.ok ? "✅" : "❌") + '</span><span>' + esc(c.nom) + '</span></div>'; });
        h += '<p class="small">En cours : jour ' + jours + ' sur ' + totalJ + '. Critères remplis aujourd\'hui : ' + n + '/3. Le verdict officiel sera donné le ' + esc(dfr(t.fin)) + '.</p></div>';
      } else {
        var nextSun = new Date(DATA.donnees_jusqu_au + "T00:00:00Z"); nextSun.setUTCDate(nextSun.getUTCDate() + ((7 - nextSun.getUTCDay()) % 7 || 7));
        var ns = nextSun.toISOString().slice(0, 10);
        h += '<div class="bar"><i style="width:' + Math.min(100, v.semaines / t.semaines * 100) + '%"></i></div><div class="small muted">Semaine ' + v.semaines + ' / ' + t.semaines + (v.statut === "en cours" ? ' · prochaine mise à jour : ' + esc(dfr(ns)) + ' (bilan de la semaine)' : '') + '</div>';
        v.criteres.forEach(function(c){ h += '<div class="crit"><span>' + (c.ok ? "✅" : "❌") + '</span><span>' + esc(c.nom) + '</span></div>'; });
        h += '<p class="small">' + esc(v.texte) + (v.statut === "en cours" ? ' Ce verdict change seulement une fois par semaine, le dimanche.' : '') + '</p></div>';
      }
    });
    var q = DATA.portefeuilles.quotidien, w = DATA.portefeuilles.hebdomadaire;
    if(q.commence){
      h += '<div class="card"><h2>Comparaison</h2><table><tr><th></th><th>Quotidien</th><th>Hebdo</th><th>Bitcoin</th></tr>' +
        '<tr><td>Rendement</td><td class="' + cls(q.rendement_pct) + '">' + pct(q.rendement_pct) + '</td><td class="' + cls(w.rendement_pct) + '">' + pct(w.rendement_pct) + '</td><td class="' + cls(q.btc_rendement_pct) + '">' + pct(q.btc_rendement_pct) + '</td></tr>' +
        '<tr><td>Pire baisse</td><td>' + pct(q.pire_baisse_pct) + '</td><td>' + pct(w.pire_baisse_pct) + '</td><td>' + pct(q.btc_pire_baisse_pct) + '</td></tr>' +
        '<tr><td>Frais</td><td>' + nf(q.frais_total) + ' $</td><td>' + nf(w.frais_total) + ' $</td><td>—</td></tr>' +
        '<tr><td>Transactions</td><td>' + q.transactions + '</td><td>' + w.transactions + '</td><td>1</td></tr></table>';
      h += '<div class="small muted" style="margin-top:8px">IC moyen (qualité des classements) : ' + (DATA.ic.moyen == null ? "pas encore mesurable" : nf(DATA.ic.moyen, 3)) + '</div></div>';
    }
    h += '<div class="card small"><h2>Les règles du test</h2>Début ' + esc(dfr(t.debut)) + ', fin ' + esc(dfr(t.fin)) + ' · ' + nf(t.capital, 0) + ' USDT fictifs par portefeuille · top ' + t.top_k + ' cryptos · filtre Bitcoin &gt; moyenne ' + t.filtre_jours + ' jours · frais ' + nf(t.frais_pct) + ' % + glissement ' + nf(t.slippage_pct) + ' %.<br><br>' +
      '3 critères sur 3 = VALIDÉ · 2 sur 3 = À PROLONGER · 0 ou 1 = NON VALIDÉ.</div>';
    return h;
  }

  function render(){
    document.querySelectorAll("#dom button").forEach(function(b){ b.classList.toggle("on", b.dataset.d === DOM); });
    document.getElementById("navsem").style.display = DOM === "matieres" || DOM === "v2" ? "none" : "";
    if(DOM !== "v2") document.getElementById("v2seg").style.display = "none";
    if(DOM === "v2"){
      if(TAB === "sem") TAB = "jour";
      document.getElementById("seg").style.display = "none"; document.getElementById("mseg").style.display = "none";
      document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === TAB); });
      return renderV2();
    }
    if(DOM === "matieres"){
      if(TAB === "sem") TAB = "jour";
      document.getElementById("seg").style.display = "none";
      document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === TAB); });
      return renderMat();
    }
    document.getElementById("mseg").style.display = "none";
    document.getElementById("title").textContent = "Signal IA Crypto";
    document.getElementById("navsem").style.display = P === "v5" ? "none" : "";
    if(P === "v5"){
      document.getElementById("seg").style.display = TAB === "ver" ? "none" : "flex";
      document.querySelectorAll("#seg button").forEach(function(b){ b.classList.toggle("on", b.dataset.p === P); });
      return renderV5();
    }
    if(!DATA) return;
    document.getElementById("updated").textContent = "Données du " + dshort(DATA.donnees_jusqu_au) + " · mis à jour " + DATA.genere_le;
    document.querySelectorAll("#seg button").forEach(function(b){ b.classList.toggle("on", b.dataset.p === P); });
    document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === TAB); });
    document.getElementById("seg").style.display = TAB === "sem" ? "none" : "flex";
    var pf = DATA.portefeuilles[P], h;
    if(TAB === "jour") h = viewJour(pf); else if(TAB === "pf") h = viewPf(pf); else if(TAB === "sem") h = viewSem(); else h = viewVer();
    h += '<div class="notice">Argent fictif — aucun ordre réel n\'est passé. Outil de recherche, pas un conseil financier.</div>';
    document.getElementById("main").innerHTML = h;
    var b = document.getElementById("donebtn");
    if(b){ b.onclick = function(){
      var k = doneKey(pf.signal);
      if(store.get(k)) store.del(k); else store.set(k, new Date().toLocaleString("fr-FR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}));
      render();
    }; }
  }

  document.getElementById("seg").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ P = b.dataset.p; store.set("pf", P); render(); window.scrollTo(0,0); } });
  document.getElementById("nav").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ TAB = b.dataset.t; store.set("tab", TAB); render(); window.scrollTo(0,0); } });
  document.getElementById("dom").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ DOM = b.dataset.d; store.set("dom", DOM); render(); window.scrollTo(0,0); } });
  document.getElementById("mseg").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ MK = b.dataset.m; store.set("mk", MK); render(); window.scrollTo(0,0); } });
  document.getElementById("v2seg").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ K2 = b.dataset.k; store.set("k2", K2); render(); window.scrollTo(0,0); } });
  document.getElementById("refresh").addEventListener("click", function(){ load(); loadMat(); loadV5(); loadV2(); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible"){ load(); loadMat(); loadV5(); loadV2(); } });
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  load(); loadMat(); loadV5(); loadV2(); render();
})();
</script>
</body>
</html>
