name: Signal crypto v5 (répartition IA)

on:
  schedule:
    - cron: "20 1 * * *"      # chaque jour à 01:20 UTC, après la mise à jour des données par le moteur v4 (00:40)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-v5
  cancel-in-progress: false

jobs:
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les bibliothèques
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install -r requirements.txt

      - name: Calculer la répartition v5 et mettre à jour le portefeuille fictif
        shell: bash
        run: |
          set -o pipefail
          python crypto_v5/run.py 2>&1 | tee crypto_v5/dernier_journal.txt

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "signal-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A crypto_v5 docs/data
          git commit -m "Crypto v5 du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git pull --rebase
          git push
