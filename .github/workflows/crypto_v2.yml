name: Signal crypto v2 (robots v11)

on:
  schedule:
    - cron: "25 4 * * *"      # chaque jour à 04:25 UTC, juste après la bougie 00:00–04:00 UTC utilisée par les robots
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-v2
  cancel-in-progress: false

jobs:
  cv2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crypto_v2/requirements.txt

      - name: Installer les bibliothèques
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r crypto_v2/requirements.txt

      - name: Faire voter les robots et mettre à jour les portefeuilles fictifs
        shell: bash
        run: |
          set -o pipefail
          python crypto_v2/run.py 2>&1 | tee crypto_v2/dernier_journal.txt

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "signal-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A crypto_v2 docs/data
          git commit -m "Crypto v2 du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git pull --rebase
          git push
