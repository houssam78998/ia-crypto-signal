name: Signal quotidien

on:
  schedule:
    - cron: "40 0 * * *"      # chaque jour à 00:40 UTC, juste après la clôture de la bougie journalière
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les bibliothèques
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install -r requirements.txt

      - name: Calculer le signal et mettre à jour les portefeuilles fictifs
        run: python engine/run.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "signal-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "Signal du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git push
