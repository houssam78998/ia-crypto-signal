name: Signal indices (robots C2 et C3)

on:
  schedule:
    - cron: "15 23 * * 1-5"   # chaque soir de semaine à 23:15 UTC, après la clôture américaine (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indices
  cancel-in-progress: false

jobs:
  indices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indices/requirements.txt

      - name: Installer les bibliothèques
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r indices/requirements.txt

      - name: Faire voter les robots et mettre à jour les portefeuilles fictifs
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python indices/run.py 2>&1 | grep -v "db-[A-Za-z0-9]" | tee indices/dernier_journal.txt

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "signal-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A indices docs/data
          git commit -m "Indices du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git pull --rebase
          git push
